<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendly Supervisor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; font-size: 13px; }

  .topbar {
    background: #0f172a; padding: 10px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .logo { font-weight: 700; font-size: 15px; color: #fff; margin-right: 6px; }
  .logo span { color: #60a5fa; }
  .topbar select, .topbar button {
    height: 32px; border-radius: 6px; border: 1px solid #334155;
    background: #1e293b; color: #e2e8f0; padding: 0 10px;
    font-size: 12px; cursor: pointer; outline: none; transition: border-color 0.2s;
  }
  .topbar select:hover { border-color: #60a5fa; }
  .week-nav {
    display: flex; align-items: center; gap: 4px;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 6px; padding: 0 4px; height: 32px;
  }
  .week-nav button {
    background: transparent; border: none; color: #94a3b8;
    font-size: 15px; width: 26px; height: 26px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer;
  }
  .week-nav button:hover { background: #334155; color: #fff; }
  .week-label { color: #e2e8f0; font-size: 12px; font-weight: 500; padding: 0 6px; white-space: nowrap; }
  .btn-refresh { background: #1e40af !important; border-color: #1e40af !important; color: #fff !important; font-weight: 500; }
  .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed !important; }
  .btn-pdf { background: #065f46 !important; border-color: #065f46 !important; color: #fff !important; font-weight: 500; }
  .sync-info { color: #64748b; font-size: 11px; margin-left: auto; display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .sync-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .tab-bar {
    background: #0f172a; border-bottom: 1px solid #1e293b;
    padding: 0 20px; display: flex; align-items: flex-end; gap: 2px;
  }
  .tab-btn {
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: none; background: transparent; color: #64748b;
    border-bottom: 3px solid transparent; transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .tab-btn:hover { color: #cbd5e1; }
  .tab-btn.active { color: #fff; border-bottom-color: #60a5fa; }

  .legend-bar {
    background: #fff; border-bottom: 1px solid #e2e8f0;
    padding: 7px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .legend-title { font-weight: 600; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #64748b; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-sep { width: 1px; height: 14px; background: #e2e8f0; }
  .closer-stats { margin-left: auto; font-size: 11px; color: #94a3b8; }

  .grid-container { padding: 14px 20px; overflow-x: auto; }
  .view-title { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .view-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .badge-global { background: #e0e7ff; color: #4338ca; }
  .badge-closer { background: #dcfce7; color: #166534; }

  .stats-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-card { background: #fff; border-radius: 8px; padding: 10px 14px; border: 1px solid #e2e8f0; min-width: 130px; }
  .stat-label { font-size: 10px; color: #94a3b8; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 2px; }
  .stat-value.green { color: #16a34a; }
  .stat-value.orange { color: #ea580c; }
  .stat-value.red { color: #dc2626; }

  .cal-grid {
    display: grid;
    grid-template-columns: 56px repeat(7, 1fr);
    gap: 1px; background: #e2e8f0;
    border-radius: 10px; overflow: hidden;
    min-width: 760px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .cal-header {
    background: #0f172a; color: #94a3b8;
    text-align: center; padding: 8px 4px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .cal-header.today { color: #60a5fa; }
  .cal-header .day-num { font-size: 17px; font-weight: 700; color: #fff; margin-top: 1px; }
  .cal-header.today .day-num { color: #60a5fa; }
  .time-label {
    background: #fff; color: #94a3b8; text-align: right;
    padding: 0 6px; font-size: 10px; font-weight: 500;
    display: flex; align-items: center; justify-content: flex-end;
    border-right: 2px solid #e2e8f0;
  }
  .slot {
    background: #fff; min-height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    transition: filter 0.1s; position: relative;
  }
  .slot:hover { filter: brightness(0.9); }
  .slot-grey   { background: #f1f5f9; color: #cbd5e1; }
  .slot-green  { background: #dcfce7; color: #15803d; }
  .slot-orange { background: #ffedd5; color: #c2410c; }
  .slot-red    { background: #fee2e2; color: #b91c1c; }
  .slot-loading { background: #f8fafc; }
  .slot-heat-0 { background: #f0fdf4; color: #166534; }
  .slot-heat-1 { background: #fff7ed; color: #9a3412; }
  .slot-heat-2 { background: #fee2e2; color: #b91c1c; }
  .slot-heat-3 { background: #fca5a5; color: #7f1d1d; font-size: 12px; }
  .slot-heat-4 { background: #ef4444; color: #fff;    font-size: 12px; }

  .slot[data-tip] { cursor: pointer; }
  .slot[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 5px); left: 50%;
    transform: translateX(-50%);
    background: #0f172a; color: #fff;
    font-size: 11px; font-weight: 400; padding: 7px 12px;
    border-radius: 6px; white-space: pre; z-index: 999;
    pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    line-height: 1.6;
  }

  /* Loading skeleton */
  .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Diagnostic */
  .diag-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .diag-table th { background: #0f172a; color: #94a3b8; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; text-align: left; }
  .diag-table td { padding: 10px 14px; font-size: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  .diag-table tr:last-child td { border-bottom: none; }
  .diag-table tr:hover td { background: #f8fafc; }
  .badge-active   { background: #dcfce7; color: #166534; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .badge-partial  { background: #fff7ed; color: #9a3412; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .badge-inactive { background: #fee2e2; color: #991b1b; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .diag-check { color: #16a34a; font-size: 14px; }
  .diag-cross { color: #dc2626; font-size: 14px; }
  .diag-loading { text-align: center; padding: 40px; color: #94a3b8; font-size: 13px; }

  /* Print */
  @media print {
    .topbar, .legend-bar { display: none !important; }
    body { background: white; }
    .grid-container { padding: 0; }
    .cal-grid { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📅 <span>Calendly</span> Supervisor</div>

  <select id="viewSelect" onchange="switchView(this.value)">
    <option value="general">📊 Vue Générale</option>
  </select>

  <div class="week-nav">
    <button onclick="prevWeek()" id="btnPrev">←</button>
    <span class="week-label" id="weekLabel">Chargement…</span>
    <button onclick="nextWeek()" id="btnNext">→</button>
  </div>

  <select id="tzSelect">
    <option value="2">🌍 Europe/Paris (UTC+2)</option>
    <option value="1">🌍 Europe/London (UTC+1)</option>
    <option value="-4">🌍 America/New_York (UTC-4)</option>
  </select>

  <button id="btnNext7" onclick="toggleNext7()" style="background:#4f46e5!important;border-color:#4f46e5!important;color:#fff!important;font-weight:500;height:32px;border-radius:6px;border:1px solid;padding:0 10px;font-size:12px;cursor:pointer;">🗓 7 prochains jours</button>
  <button class="btn-refresh" id="btnRefresh" onclick="hardRefresh()">↻ Actualiser</button>
  <button class="btn-pdf" onclick="window.print()">⬇ Export PDF</button>

  <div class="sync-info">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncTime">Chargement…</span>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-calendar" onclick="switchTab('calendar')">📊 Calendrier</button>
  <button class="tab-btn" id="tab-rdv_count" onclick="switchTab('rdv_count')">📈 Compteur RDV</button>
  <button class="tab-btn" id="tab-diagnostic" onclick="switchTab('diagnostic')">🔍 Diagnostic</button>
</div>

<div class="legend-bar">
  <span class="legend-title" id="legendTitle">Vue Générale</span>
  <div class="legend-item legend-gen"><div class="legend-dot" style="background:#dcfce7;border:1.5px solid #86efac"></div>&gt;1 closer dispo</div>
  <div class="legend-item legend-gen"><div class="legend-dot" style="background:#ffedd5;border:1.5px solid #fdba74"></div>1 closer dispo</div>
  <div class="legend-item legend-gen"><div class="legend-dot" style="background:#fee2e2;border:1.5px solid #fca5a5"></div>0 dispo</div>
  <div class="legend-item legend-gen"><div class="legend-dot" style="background:#f1f5f9;border:1.5px solid #cbd5e1"></div>Hors horaires</div>
  <div class="legend-sep"></div>
  <div class="legend-item legend-ind" style="display:none"><div class="legend-dot" style="background:#dcfce7;border:1.5px solid #86efac"></div>Disponible</div>
  <div class="legend-item legend-ind" style="display:none"><div class="legend-dot" style="background:#fee2e2;border:1.5px solid #fca5a5"></div>RDV posé</div>
  <div class="legend-item legend-ind" style="display:none"><div class="legend-dot" style="background:#f1f5f9;border:1.5px solid #cbd5e1"></div>Indisponible</div>
  <div class="legend-item legend-rdv" style="display:none"><div class="legend-dot" style="background:#f0fdf4;border:1.5px solid #86efac"></div>0 RDV</div>
  <div class="legend-item legend-rdv" style="display:none"><div class="legend-dot" style="background:#fff7ed;border:1.5px solid #fdba74"></div>1 RDV</div>
  <div class="legend-item legend-rdv" style="display:none"><div class="legend-dot" style="background:#fee2e2;border:1.5px solid #fca5a5"></div>2 RDV</div>
  <div class="legend-item legend-rdv" style="display:none"><div class="legend-dot" style="background:#ef4444;border:1.5px solid #dc2626"></div>4+ RDV</div>
  <div class="legend-item legend-rdv" style="display:none"><div class="legend-dot" style="background:#f1f5f9;border:1.5px solid #cbd5e1"></div>Hors horaires</div>
  <span class="closer-stats" id="closerStats"></span>
</div>

<div class="grid-container" id="printArea">
  <div class="stats-row" id="statsRow"></div>
  <div class="view-title">
    <span id="viewTitle">Vue Générale — Tous les closers</span>
    <span class="view-badge badge-global" id="viewBadge">Global</span>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<script>
const FR_DAYS   = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const FR_MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

let currentView  = 'general';
let currentTab   = 'calendar';
let weekOffset   = 0;
let next7Mode    = false;
let next7Cache   = null;
let weekCache    = {};
let membersCache = null;
let loading      = false;

// ── Today detection ────────────────────────────────────────────────────────
const TODAY = new Date();

function getTodayIdx(offset) {
  const BASE = new Date(2026, 4, 11); // Mon May 11 2026
  const mon  = new Date(BASE);
  mon.setDate(mon.getDate() + offset * 7);
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    if (d.toDateString() === TODAY.toDateString()) return i;
  }
  return -1;
}

function getWeekDayLabels(offset) {
  const BASE = new Date(2026, 4, 11);
  const result = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(BASE);
    d.setDate(d.getDate() + offset * 7 + i);
    result.push({ day: FR_DAYS[i], date: d.getDate() });
  }
  return result;
}

// ── API calls ──────────────────────────────────────────────────────────────
async function fetchWeek(offset) {
  if (weekCache[offset]) return weekCache[offset];
  const r = await fetch(`/api/week?offset=${offset}`);
  if (!r.ok) throw new Error(`API error ${r.status}`);
  const data = await r.json();
  weekCache[offset] = data;
  return data;
}

async function fetchNext7() {
  if (next7Cache) return next7Cache;
  const r = await fetch('/api/next7');
  if (!r.ok) throw new Error(`API error ${r.status}`);
  next7Cache = await r.json();
  return next7Cache;
}

async function loadActivity() {
  try {
    const r = await fetch('/api/activity');
    if (!r.ok) return;
    const activity = await r.json();
    if (!activity || activity.error) return;

    // Met à jour les dots directement via opt.value (= nom du membre)
    const sel = document.getElementById('viewSelect');
    for (let i = 1; i < sel.options.length; i++) {
      const opt = sel.options[i];
      const status = activity[opt.value];
      if (!status) continue;
      opt.textContent = (status.active ? '🟢' : '🔴') + ' ' + opt.value;
    }

    // Recharge silencieusement pour exclure les inactifs
    weekCache = {};
    next7Cache = null;
    const data = await fetchWeek(weekOffset);
    renderGrid(data);
  } catch(e) { /* silencieux */ }
}

async function fetchMembers() {
  if (membersCache) return membersCache;
  const r = await fetch('/api/members');
  const data = await r.json();
  if (!Array.isArray(data)) throw new Error(data.error || 'Erreur API membres');
  membersCache = data;
  return data;
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  setLoading(true);
  try {
    const members = await fetchMembers();
    const sel = document.getElementById('viewSelect');
    sel.innerHTML = '<option value="general">📊 Vue Générale</option>';
    members.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name;
      opt.textContent = '👤 ' + m.name;
      sel.appendChild(opt);
    });
    await loadWeek(weekOffset);
    loadActivity(); // asynchrone, met à jour les dots sans bloquer
  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

async function loadWeek(offset) {
  setLoading(true);
  document.getElementById('weekLabel').textContent = 'Chargement…';
  try {
    const data = await fetchWeek(offset);
    renderGrid(data);
    setSyncTime();
  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

// ── Render ─────────────────────────────────────────────────────────────────
function getNext7DayLabels() {
  const today = new Date();
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    return { day: FR_DAYS[d.getDay() === 0 ? 6 : d.getDay() - 1], date: d.getDate() };
  });
}

function renderGrid(data) {
  const grid       = document.getElementById('calGrid');
  const isRdvCount = currentTab === 'rdv_count';
  const isGeneral  = currentView === 'general';
  const gridData   = isGeneral ? data.general : data.users[currentView];
  const weekDays  = next7Mode ? getNext7DayLabels() : getWeekDayLabels(weekOffset);
  const todayIdx  = next7Mode ? 0 : getTodayIdx(weekOffset);

  document.getElementById('weekLabel').textContent = data.week_label;
  grid.innerHTML = '';

  // Corner
  const corner = document.createElement('div');
  corner.className = 'cal-header';
  grid.appendChild(corner);

  // Day headers
  weekDays.forEach((d, i) => {
    const h = document.createElement('div');
    h.className = 'cal-header' + (i === todayIdx ? ' today' : '');
    h.innerHTML = `${d.day}<div class="day-num">${d.date}</div>`;
    grid.appendChild(h);
  });

  // Slots
  data.slot_labels.forEach((label, si) => {
    const tl = document.createElement('div');
    tl.className = 'time-label';
    tl.textContent = label;
    grid.appendChild(tl);

    for (let di = 0; di < 7; di++) {
      const cell = document.createElement('div');
      cell.className = 'slot';

      if (!gridData) {
        cell.classList.add('slot-grey');
      } else if (isRdvCount) {
        if (isGeneral) {
          const slot = gridData[di][si];
          if (slot.color === 'grey') {
            cell.classList.add('slot-grey');
          } else {
            const n = slot.booked;
            const heatClass = n === 0 ? 'slot-heat-0' : n === 1 ? 'slot-heat-1' : n === 2 ? 'slot-heat-2' : n === 3 ? 'slot-heat-3' : 'slot-heat-4';
            cell.classList.add(heatClass);
            cell.textContent = n > 0 ? n : '';
            if (n > 0) {
              const names = data.user_order.filter(nm => data.users[nm]?.[di]?.[si] === 'red');
              if (names.length) cell.dataset.tip = '🔴 RDV:\n' + names.join('\n');
            }
          }
        } else {
          const status = gridData[di][si];
          if (status === 'grey')       { cell.classList.add('slot-grey'); }
          else if (status === 'red')   { cell.classList.add('slot-heat-2'); cell.textContent = '1'; }
          else                         { cell.classList.add('slot-heat-0'); }
        }
      } else if (isGeneral) {
        const slot = gridData[di][si];
        if      (slot.color === 'green')  { cell.classList.add('slot-green');  cell.textContent = slot.label; }
        else if (slot.color === 'orange') { cell.classList.add('slot-orange'); cell.textContent = slot.label; }
        else if (slot.color === 'red')    { cell.classList.add('slot-red');    cell.textContent = slot.label; }
        else                              { cell.classList.add('slot-grey'); }

        if (slot.color !== 'grey') {
          const booked = data.user_order.filter(n => data.users[n]?.[di]?.[si] === 'red');
          const free   = data.user_order.filter(n => data.users[n]?.[di]?.[si] === 'green');
          let tip = '';
          if (booked.length) tip += '🔴 RDV: ' + booked.join(', ');
          if (booked.length && free.length) tip += '\n';
          if (free.length)   tip += '🟢 Dispo: ' + free.join(', ');
          if (tip) cell.dataset.tip = tip;
        }
      } else {
        const status = gridData[di][si];
        if      (status === 'green') { cell.classList.add('slot-green'); cell.textContent = '✓'; }
        else if (status === 'red')   { cell.classList.add('slot-red');   cell.textContent = 'RDV'; }
        else                         { cell.classList.add('slot-grey'); }
      }

      grid.appendChild(cell);
    }
  });

  updateStats(isGeneral, isRdvCount, gridData, data);
}

function updateStats(isGeneral, isRdvCount, gridData, data) {
  const statsRow = document.getElementById('statsRow');

  if (isRdvCount && gridData) {
    if (isGeneral) {
      let totalRdv = 0, maxSlot = 0;
      gridData.forEach(day => day.forEach(slot => {
        if (slot.color !== 'grey') { totalRdv += slot.booked; if (slot.booked > maxSlot) maxSlot = slot.booked; }
      }));
      statsRow.style.display = 'flex';
      statsRow.innerHTML = `
        <div class="stat-card"><div class="stat-label">Closers actifs</div><div class="stat-value">${data.user_order.length}</div></div>
        <div class="stat-card"><div class="stat-label">Total RDV semaine</div><div class="stat-value red">${totalRdv}</div></div>
        <div class="stat-card"><div class="stat-label">Max RDV / créneau</div><div class="stat-value ${maxSlot >= 3 ? 'red' : maxSlot >= 2 ? 'orange' : 'green'}">${maxSlot}</div></div>`;
    } else {
      let rdv = 0;
      gridData.forEach(day => day.forEach(s => { if (s === 'red') rdv++; }));
      statsRow.style.display = 'none';
      document.getElementById('closerStats').textContent = `${rdv} RDV posés cette semaine`;
    }
    return;
  }

  if (isGeneral && gridData) {
    let totalGreen = 0, totalRed = 0, totalSlots = 0;
    gridData.forEach(day => day.forEach(slot => {
      if (slot.color !== 'grey') {
        totalSlots++;
        if (slot.color === 'red') totalRed++; else totalGreen++;
      }
    }));
    const rate = totalSlots > 0 ? Math.round(totalRed / totalSlots * 100) : 0;
    statsRow.style.display = 'flex';
    statsRow.innerHTML = `
      <div class="stat-card"><div class="stat-label">Closers actifs</div><div class="stat-value">${data.user_order.length}</div></div>
      <div class="stat-card"><div class="stat-label">Slots libres</div><div class="stat-value green">${totalGreen}</div></div>
      <div class="stat-card"><div class="stat-label">RDV posés</div><div class="stat-value red">${totalRed}</div></div>
      <div class="stat-card"><div class="stat-label">Taux remplissage</div><div class="stat-value ${rate > 70 ? 'red' : rate > 40 ? 'orange' : 'green'}">${rate}%</div></div>`;
  } else if (!isGeneral && gridData) {
    let green = 0, red = 0;
    gridData.forEach(day => day.forEach(s => { if (s === 'green') green++; if (s === 'red') red++; }));
    statsRow.style.display = 'none';
    document.getElementById('closerStats').textContent = `${red} RDV posés · ${green} slots libres cette semaine`;
  } else {
    statsRow.style.display = 'none';
    document.getElementById('closerStats').textContent = '';
  }
}

// ── Controls ───────────────────────────────────────────────────────────────
async function loadDiagnostic() {
  const area = document.getElementById('printArea');
  area.innerHTML = '<div class="diag-loading">⏳ Analyse en cours… (10-20 secondes)</div>';
  try {
    const r = await fetch('/api/diagnostic');
    if (!r.ok) throw new Error(`API error ${r.status}`);
    const data = await r.json();
    renderDiagnostic(data);
  } catch(e) {
    area.innerHTML = `<div class="diag-loading" style="color:#dc2626">⚠ Erreur : ${e.message}</div>`;
  }
}

function renderDiagnostic(data) {
  const area = document.getElementById('printArea');
  const rows = data.map(m => {
    const badge = m.score === 4 ? '<span class="badge-active">Actif</span>'
                : m.score >= 2  ? '<span class="badge-partial">Partiel</span>'
                :                 '<span class="badge-inactive">Inactif</span>';
    const chk  = v => v ? '<span class="diag-check">✓</span>' : '<span class="diag-cross">✗</span>';
    const rdvP = m.rdv_past_30  != null ? m.rdv_past_30  : '—';
    const rdvF = m.rdv_next_30  != null ? m.rdv_next_30  : '—';
    const et   = m.event_types && m.event_types.length ? m.event_types.join(', ') : '<span style="color:#94a3b8">Aucun</span>';
    return `<tr>
      <td><strong>${m.name}</strong><br><span style="color:#94a3b8;font-size:11px">${m.email}</span></td>
      <td>${badge}</td>
      <td>${chk(m.has_hours)} ${m.active_days}j/7</td>
      <td>${chk(m.has_event_types)} <span style="color:#64748b;font-size:11px">${et}</span></td>
      <td style="text-align:center">${rdvP}</td>
      <td style="text-align:center">${rdvF}</td>
    </tr>`;
  }).join('');

  area.innerHTML = `
    <div class="view-title" style="margin-bottom:12px">
      <span>Diagnostic — Activité des comptes Calendly</span>
      <span class="view-badge badge-global">Diagnostic</span>
    </div>
    <table class="diag-table">
      <thead><tr>
        <th>Membre</th><th>Statut</th><th>Horaires</th><th>Event types actifs</th>
        <th style="text-align:center">RDV 30j passés</th><th style="text-align:center">RDV 30j à venir</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function updateLegendAndTitle() {
  const isRdv     = currentTab === 'rdv_count';
  const isGeneral = currentView === 'general';
  document.querySelectorAll('.legend-gen').forEach(el => el.style.display = (!isRdv && isGeneral)  ? 'flex' : 'none');
  document.querySelectorAll('.legend-ind').forEach(el => el.style.display = (!isRdv && !isGeneral) ? 'flex' : 'none');
  document.querySelectorAll('.legend-rdv').forEach(el => el.style.display = isRdv                  ? 'flex' : 'none');
  const titleSuffix = isGeneral ? 'Tous les closers' : currentView;
  const tabLabel    = isRdv ? 'Compteur RDV' : (isGeneral ? 'Vue Générale' : 'Vue Individuelle');
  document.getElementById('legendTitle').textContent = tabLabel;
  document.getElementById('viewTitle').textContent   = isRdv ? `Compteur RDV — ${titleSuffix}` : (isGeneral ? 'Vue Générale — Tous les closers' : `Vue individuelle — ${currentView}`);
  document.getElementById('viewBadge').textContent   = isGeneral ? 'Global' : 'Closer';
  document.getElementById('viewBadge').className     = 'view-badge ' + (isGeneral ? 'badge-global' : 'badge-closer');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('closerStats').textContent = '';

  const isDiag = tab === 'diagnostic';
  document.getElementById('viewSelect').style.display = isDiag ? 'none' : '';
  document.getElementById('btnNext7').style.display   = isDiag ? 'none' : '';
  document.querySelector('.week-nav').style.display   = isDiag ? 'none' : '';
  document.getElementById('legendTitle').textContent  = isDiag ? 'Diagnostic' : '';
  document.querySelectorAll('.legend-gen,.legend-ind,.legend-rdv').forEach(el => el.style.display = 'none');

  if (isDiag) {
    loadDiagnostic();
    return;
  }

  document.querySelector('.week-nav').style.opacity       = next7Mode ? '0.35' : '';
  document.querySelector('.week-nav').style.pointerEvents = next7Mode ? 'none' : '';
  updateLegendAndTitle();
  if (next7Mode) { if (next7Cache) renderGrid(next7Cache); }
  else if (weekCache[weekOffset]) renderGrid(weekCache[weekOffset]);
}

function switchView(val) {
  currentView = val;
  document.getElementById('closerStats').textContent = '';
  updateLegendAndTitle();
  if (weekCache[weekOffset]) renderGrid(weekCache[weekOffset]);
}

function prevWeek() { if (!loading && !next7Mode) { weekOffset--; loadWeek(weekOffset); } }
function nextWeek() { if (!loading && !next7Mode) { weekOffset++; loadWeek(weekOffset); } }

async function toggleNext7() {
  next7Mode = !next7Mode;
  const btn = document.getElementById('btnNext7');
  const nav = document.querySelector('.week-nav');
  if (next7Mode) {
    btn.style.background = '#7c3aed';
    btn.style.borderColor = '#7c3aed';
    btn.textContent = '✕ Semaine calendaire';
    nav.style.opacity = '0.35';
    nav.style.pointerEvents = 'none';
    setLoading(true);
    try {
      const data = await fetchNext7();
      renderGrid(data);
      setSyncTime();
    } catch(e) { showError(e.message); }
    finally { setLoading(false); }
  } else {
    btn.style.background = '#4f46e5';
    btn.style.borderColor = '#4f46e5';
    btn.textContent = '🗓 7 prochains jours';
    nav.style.opacity = '';
    nav.style.pointerEvents = '';
    if (weekCache[weekOffset]) renderGrid(weekCache[weekOffset]);
    else loadWeek(weekOffset);
  }
}

async function hardRefresh() {
  weekCache = {};
  next7Cache = null;
  membersCache = null;
  await fetch('/api/refresh', { method: 'POST' });
  await init();
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setLoading(on) {
  loading = on;
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (on ? ' loading' : '');
  document.getElementById('btnRefresh').disabled = on;
}

function setSyncTime() {
  document.getElementById('syncTime').textContent =
    'Sync ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function showError(msg) {
  document.getElementById('weekLabel').textContent = '⚠ Erreur';
  document.getElementById('syncTime').textContent = msg;
}

// Auto-refresh every 60 min
setInterval(hardRefresh, 60 * 60 * 1000);

init();
</script>
</body>
</html>
